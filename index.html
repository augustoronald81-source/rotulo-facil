<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rótulo Fácil | Entenda o que você consome - Educação Nutricional</title>
    <meta name="description" content="Aprenda a interpretar a tabela nutricional dos alimentos e consulte informações nutricionais pelo código de barras segundo as normas da Anvisa." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- VLibras Widget Oficial de Acessibilidade -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js" async></script>
    <script>
      (function() {
        function initVLibras() {
          try {
            if (window.VLibras && window.VLibras.Widget && !window.__vlibrasWidgetInstance) {
              window.__vlibrasWidgetInstance = new window.VLibras.Widget('https://vlibras.gov.br/app');
            }
          } catch (e) {
            console.warn('VLibras não inicializado:', e);
          }
        }
        window.addEventListener('load', initVLibras);
        var script = document.querySelector('script[src*="vlibras-plugin.js"]');
        if (script) {
          script.addEventListener('load', initVLibras);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
